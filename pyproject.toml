[project]
name = "slidegen"
version = "0.1.0"
description = "Turn rough notes into a short, well-structured PowerPoint deck."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pywin32>=312 ; sys_platform == 'win32'",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slidegen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
